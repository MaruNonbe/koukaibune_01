<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>座繰り機 AR - Freedom Edition</title>

  <!-- A-Frame & AR.js -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
    }

    #top-ui-container,
    #bottom-ui-container {
      position: fixed;
      left: 0;
      width: 100%;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    #top-ui-container { top: calc(12px + env(safe-area-inset-top)); gap: 8px; }
    #bottom-ui-container { bottom: calc(18px + env(safe-area-inset-bottom)); gap: 10px; }

    .ui-bar, .pad-grid {
      background: rgba(15, 23, 42, 0.68);
      border: 1px solid rgba(255,255,255,0.22);
      backdrop-filter: blur(10px);
      pointer-events: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }

    .ui-bar {
      display: flex;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 16px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: min(96vw, 720px);
    }

    .pad-grid {
      display: grid;
      gap: 8px;
      padding: 14px;
      border-radius: 20px;
      grid-template-columns: repeat(3, 58px);
      grid-template-rows: repeat(3, 58px);
    }

    .btn {
      width: 54px;
      height: 54px;
      background: #ffffff;
      border: none;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      color: #263241;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      box-shadow: 0 3px 10px rgba(0,0,0,0.18);
    }

    .btn:active { transform: translateY(1px); background: #e0f2fe; }

    .btn-icon { flex-direction: column; font-size: 10px; color: #1f2937; line-height: 1.1; }
    .btn-icon span { font-size: 18px; margin-bottom: 2px; }

    .mode-switch { background: #1f2937 !important; color: #fff !important; font-weight: 800; width: 84px !important; font-size: 12px; }
    .mode-gps { background: #0ea5e9 !important; }

    .btn-stop { background: #ef4444; color: #fff; font-weight: 800; font-size: 13px; }

    #debug-info {
      position: fixed;
      bottom: calc(10px + env(safe-area-inset-bottom));
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.52);
      font-size: 11px;
      z-index: 10000;
      pointer-events: none;
      padding: 7px 9px;
      border-radius: 8px;
      white-space: pre-line;
      max-width: calc(100vw - 20px);
    }

    /* Copyright 表示（右下固定） */
    #copyright {
      position: fixed;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      color: rgba(255,255,255,0.85);
      font-size: 12px;
      z-index: 9999;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div id="debug-info">モード: 自由配置（Manual）</div>

<!-- A-Frame Scene -->
<a-scene
  vr-mode-ui="enabled: false"
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false; videoTexture: true; facingMode: environment;"
  renderer="precision: mediump; antialias: true; alpha: true; colorManagement: true; exposure: 1.2;"
>
  <a-light type="ambient" color="#FFF" intensity="1.45"></a-light>
  <a-light type="directional" position="-1 4 2" intensity="1.0"></a-light>
  <a-light type="hemisphere" color="#FFF" groundColor="#445" intensity="1.1"></a-light>

  <a-camera id="main-camera"></a-camera>

  <!-- ★★★ 座繰り機モデルに変更 ★★★ -->
  <a-entity id="ship"
            gltf-model="Zaguriki/Zaguriki.glb"
            position="0 -0.5 -15"
            rotation="0 180 0"
            scale="5 5 5">
  </a-entity>

</a-scene>

<!-- 上部UI -->
<div id="top-ui-container">
  <div class="ui-bar">
    <div class="btn mode-switch" id="btn-mode">GPS OFF</div>
    <div class="btn btn-icon" id="btn-horn"><span>♪</span><div>音</div></div>
    <div class="btn btn-icon" id="btn-height-up"><span>▲</span><div>高さ</div></div>
    <div class="btn btn-icon" id="btn-height-down"><span>▼</span><div>高さ</div></div>
    <div class="btn btn-icon" id="btn-zoom-in"><span>＋</span><div>拡大</div></div>
    <div class="btn btn-icon" id="btn-zoom-out"><span>−</span><div>縮小</div></div>
    <div class="btn btn-icon" id="btn-capture"><span>□</span><div>撮影</div></div>
  </div>
</div>

<!-- 下部UI -->
<div id="bottom-ui-container">
  <div class="pad-grid">
    <div class="btn" id="btn-curve-left-fwd">↖</div>
    <div class="btn" id="btn-fwd">↑</div>
    <div class="btn" id="btn-curve-right-fwd">↗</div>
    <div class="btn" id="btn-turn-left">←</div>
    <div class="btn btn-stop" id="btn-stop">STOP</div>
    <div class="btn" id="btn-turn-right">→</div>
    <div class="btn" id="btn-curve-left-back">↙</div>
    <div class="btn" id="btn-back">↓</div>
    <div class="btn" id="btn-curve-right-back">↘</div>
  </div>
</div>

<!-- Copyright 表示 -->
<div id="copyright">© 2026 Freedom</div>

</body>
</html>
