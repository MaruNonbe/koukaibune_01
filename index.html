<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
                 user-scalable=no, viewport-fit=cover" />
  <title>WebAR Unified — Ship & Crane</title>

  <!-- A-Frame & AR.js（船AR用） -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <!-- Three.js（CraneAR用） -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"

  <style>

    /* ▼ 船AR（A‑Frame）UIのCSS（あなたの既存コードを統合） */
    /* …この後 Part 2 で続きます… */

<div id="mode-switcher">

<script type="module">
  import * as THREE from "three";
  import { OrbitControls } from "three/addons/controls/OrbitControls.js";
  import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
  import { ARButton } from "three/addons/webxr/ARButton.js";

  /* ------------------------------
     CraneAR 初期設定
  ------------------------------ */
  const PART_MAP = {
    frontWheels: ["FrontWheel_FL", "FrontWheel_FR"],
    turntable: "Turntable_Yaw",
    boomPitch: "BoomPitch_X",
    boomExtend: "BoomExtend_Z",
    boomSecondExtend: "BoomSecondExtend_Z",
    hook: "HookHoist_Y",
    hookSwing: "HookBlock_Swing",
    cockpitAnchor: "Camera_Cockpit_View",
    outriggers: [
      { side: -1, root: "Outrigger_Front_L", beam: "Outrigger_Front_L_Beam", collar: "Outrigger_Front_L_Collar", jack: "Outrigger_Front_L_Jack", foot: "Outrigger_Front_L_Foot" },
      { side: 1, root: "Outrigger_Front_R", beam: "Outrigger_Front_R_Beam", collar: "Outrigger_Front_R_Collar", jack: "Outrigger_Front_R_Jack", foot: "Outrigger_Front_R_Foot" },
      { side: -1, root: "Outrigger_Rear_L", beam: "Outrigger_Rear_L_Beam", collar: "Outrigger_Rear_L_Collar", jack: "Outrigger_Rear_L_Jack", foot: "Outrigger_Rear_L_Foot" },
      { side: 1, root: "Outrigger_Rear_R", beam: "Outrigger_Rear_R_Beam", collar: "Outrigger_Rear_R_Collar", jack: "Outrigger_Rear_R_Jack", foot: "Outrigger_Rear_R_Foot" }
    ]
  };

  const app = document.querySelector("#app");
  const loadState = document.querySelector("#loadState");
  const status = document.querySelector("#status");
  const nodeList = document.querySelector("#nodeList");
  const quickLookLink = document.querySelector("#quickLookLink");
  const panel = document.querySelector(".panel");
  const panelToggle = document.querySelector("#panelToggle");
  const kySummary = document.querySelector("#kySummary");

  const ASSET_VERSION = "20260628-outrigger-foot-stowed-up";
  const BOOM_STAGE_TRAVEL = 1.15;
  const OUTRIGGER_SIDE_TRAVEL = 0;
  const OUTRIGGER_BEAM_SHIFT = 0.38;
  const OUTRIGGER_BEAM_SCALE = 2.3;
  const OUTRIGGER_TIP_TRAVEL = 1.15;
  const OUTRIGGER_DOWN_TRAVEL = 0.48;
  const OUTRIGGER_JACK_BASE_LENGTH = 0.64;
  const OUTRIGGER_LIFT = 0.28;

  const KY_SCENARIOS = {
    outrigger: {
      title: "KY1 アウトリガー未展開",
      summary: "アウトリガー未展開のままブームを伸ばすと、車体が不安定になります。作業前に張出し・接地・水平を確認します。"
    },
    underload: {
      title: "KY2 吊り荷下への立入",
      summary: "吊り荷の下やワイヤー直下へ人が入ると、落下・振れによる接触災害につながります。吊り荷下は立入禁止にします。"
    },
    slew: {
      title: "KY3 旋回範囲内への接近",
      summary: "旋回台とブームの作業半径内に人や障害物が入ると、挟まれ・接触の危険があります。旋回範囲を明示します。"
    }
  };

  const isIOS =
    /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  /* ------------------------------
     Three.js Renderer
  ------------------------------ */
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.xr.enabled = true;
  app.appendChild(renderer.domElement);

  /* ------------------------------
     Scene / Camera / Controls
  ------------------------------ */
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111820);

  const camera = new THREE.PerspectiveCamera(54, innerWidth / innerHeight, 0.01, 500);
  camera.position.set(5.8, 3.4, 7.2);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.target.set(0, 1.2, 0);

  const vehicle = new THREE.Group();
  scene.add(vehicle);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x55606a, 2.4);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xffffff, 2.4);
  sun.position.set(4, 8, 5);
  scene.add(sun);

  const grid = new THREE.GridHelper(18, 18, 0x7d8790, 0x29313a);
  grid.position.y = -0.02;
  scene.add(grid);

  const kyGroup = new THREE.Group();
  kyGroup.name = "KY_Hazard_Examples";
  scene.add(kyGroup);

  /* ------------------------------
     CraneAR モデル読み込み
  ------------------------------ */
  const parts = {};
  const input = { forward: false, backward: false, left: false, right: false, brake: false };

  const state = {
    speed: 0,
    steer: 0,
    scale: 1,
    basePositions: new Map(),
    baseVehicleY: 0,
    view: "outside",
    lastSlew: 0,
    lastBoomPitch: 12,
    lastBoomExtend: 0,
    lastVehicleSpeed: 0,
    hookSwingSide: 0,
    hookSwingForward: 0,
    hookSwingSideVelocity: 0,
    hookSwingForwardVelocity: 0,
    kyScenario: null,
    kyPlaying: false,
    kyTime: 0,
    modelReady: false
  };

  /* ------------------------------
     GLTFLoader（Craneモデル）
  ------------------------------ */
  new GLTFLoader().load(
    "models/webar_crane_generated.glb",
    gltf => {
      const model = gltf.scene;
      vehicle.add(model);

      centerModel(model);
      cacheParts(model);
      syncControlsToModel();

      state.modelReady = true;
      loadState.textContent = "モデル読込完了";
      status.textContent = "走行・作業装置・視点切替を試せます";

      applyView(true);
    },
    progress => {
      if (progress.total) {
        const pct = Math.round((progress.loaded / progress.total) * 100);
        loadState.textContent = `モデル読込中 ${pct}%`;
      }
    },
    error => {
      console.error(error);
      loadState.textContent = "読込エラー";
      status.textContent = "ローカルサーバー経由で開いてください";
    }
  );

  /* ------------------------------
     レンダリングループ
  ------------------------------ */
  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);

    updateDrive(dt);
    updateHookSwing(dt);
    updateKyScenario(dt);

    controls.update();
    renderer.render(scene, camera);
  });

  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
</script>
<!-- ▼ 船AR：A‑Frame ロジック -->
<script>
/* ----------------------------------------------------------
   ★ モデル切替（船AR・CraneAR 共通モデル）
---------------------------------------------------------- */
const models = [
  "Koukaibune.glb",
  "Zaguriki.glb",
  "Nagai_City_Hall.glb",
  "Cafe-v1.glb",
  "Flower.glb",
  "Barnic_Face_Hole.glb"
];

let modelIndex = 0;

document.getElementById('btn-change-model').onclick = () => {
  modelIndex = (modelIndex + 1) % models.length;
  const nextModel = models[modelIndex];
  ship.setAttribute("gltf-model", `models/${nextModel}`);
  setStatus(`モデル切替: ${nextModel}`);
};

/* ----------------------------------------------------------
   ★ 船AR：既存ロジック（あなたのコードを完全統合）
---------------------------------------------------------- */
const ship = document.querySelector('#ship');
const bowWave = document.querySelector('#bow-wave');
const waterSurface = document.querySelector('#water-surface');
const camera = document.querySelector('#main-camera');
const btnMode = document.getElementById('btn-mode');
const debug = document.getElementById('debug-info');
const THREE_A = AFRAME.THREE;

let isGpsMode = false;
let curScale = 5.0;
let stateShip = { moving: 0, turning: 0 };
let zoomState = 0;
let heightState = 0;
let bobOffset = 0;
let lastMoving = 0;

/* 小鵜飼船の実際の位置（GPSモード用） */
const targetLat = 38.114742;
const targetLon = 140.033621;

/* 船の前方向（ローカル座標） */
const MODEL_FORWARD_LOCAL = new THREE_A.Vector3(-1, 0, 0);

function setStatus(text) {
  debug.innerText = text;
}

/* ----------------------------------------------------------
   ★ モーションセンサー許可（iPhone用）
---------------------------------------------------------- */
async function requestMotionPermissionIfNeeded() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res !== 'granted') throw new Error('DeviceOrientation permission denied');
    }

    if (typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function') {
      const res2 = await DeviceMotionEvent.requestPermission();
      if (res2 !== 'granted') throw new Error('DeviceMotion permission denied');
    }

    return true;
  } catch (e) {
    console.warn(e);
    alert('モーションセンサーの許可が必要です。「許可」を選択してください。');
    return false;
  }
}

/* ----------------------------------------------------------
   ★ GPSモード切替
---------------------------------------------------------- */
btnMode.onclick = async () => {
  const ok = await requestMotionPermissionIfNeeded();
  if (!ok) return;

  isGpsMode = !isGpsMode;

  if (isGpsMode) {
    btnMode.innerText = 'GPS ON';
    btnMode.classList.add('mode-gps');

    setStatus('モード: GPS固定（位置情報を取得中…）');

    camera.setAttribute('gps-camera', 'gpsMinDistance: 0; gpsTimeInterval: 1000;');
    ship.setAttribute('gps-entity-place', `latitude: ${targetLat}; longitude: ${targetLon};`);
    ship.removeAttribute('position');

    window.addEventListener('gps-camera-update-position', (e) => {
      const { latitude, longitude, accuracy } = e.detail.position;
      setStatus(
        `モード: GPS固定\n現在地: ${latitude.toFixed(6)}, ${longitude.toFixed(6)}\n精度: ±${Math.round(accuracy)}m`
      );
    });

  } else {
    location.reload();
  }
};

/* ----------------------------------------------------------
   ★ ピンチズーム
---------------------------------------------------------- */
let initialDist = 0;

window.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    initialDist = Math.hypot(
      e.touches[0].pageX - e.touches[1].pageX,
      e.touches[0].pageY - e.touches[1].pageY
    );
  }
}, {passive: true});

window.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && initialDist > 0) {
    if (e.cancelable) e.preventDefault();

    const dist = Math.hypot(
      e.touches[0].pageX - e.touches[1].pageX,
      e.touches[0].pageY - e.touches[1].pageY
    );

    const diff = dist / initialDist;
    curScale *= diff;
    curScale = Math.max(0.1, Math.min(curScale, 50));

    ship.object3D.scale.set(curScale, curScale, curScale);
    initialDist = dist;
  }
}, {passive: false});

/* ----------------------------------------------------------
   ★ 波揺れ処理
---------------------------------------------------------- */
function updateWaveMotion(mesh) {
  const t = performance.now() * 0.001;
  const speed = Math.abs(stateShip.moving);
  const turn = Math.abs(stateShip.turning);

  const waveStrength = 0.012 + speed * 0.02 + turn * 0.006;
  const nextBob = Math.sin(t * 1.55) * (0.014 + speed * 0.018);

  mesh.position.y += nextBob - bobOffset;
  bobOffset = nextBob;

  mesh.rotation.z = Math.sin(t * 1.7) * waveStrength;
  mesh.rotation.x = Math.sin(t * 1.18 + 0.7) * waveStrength * 0.55;

  if (waterSurface) {
    const opacity = speed > 0 ? 0.24 : 0.14;
    waterSurface.setAttribute('visible', true);

    const circle = waterSurface.querySelector('a-circle');
    if (circle) {
      circle.setAttribute(
        'material',
        `color: #38bdf8; transparent: true; opacity: ${opacity}; side: double; shader: flat`
      );
    }
  }
}

/* ----------------------------------------------------------
   ★ メインループ（移動・旋回・波揺れ）
---------------------------------------------------------- */
function loopShip() {
  requestAnimationFrame(loopShip);
  if (!ship.object3D) return;

  const mesh = ship.object3D;

  updateWaveMotion(mesh);

  const showWake = stateShip.moving > 0;
  if (lastMoving !== stateShip.moving) {
    bowWave.setAttribute('visible', showWake ? 'true' : 'false');
    lastMoving = stateShip.moving;
  }

  if (stateShip.turning !== 0) {
    mesh.rotation.y += THREE_A.MathUtils.degToRad(1.0) * stateShip.turning;
  }

  if (!isGpsMode && stateShip.moving !== 0) {
    const forward = MODEL_FORWARD_LOCAL.clone()
      .applyQuaternion(mesh.quaternion)
      .normalize();

    mesh.position.addScaledVector(forward, stateShip.moving * 0.04);
  }

  if (zoomState !== 0) {
    curScale += zoomState * 0.05;
    curScale = Math.max(0.1, Math.min(curScale, 50));
    mesh.scale.set(curScale, curScale, curScale);
  }

  if (!isGpsMode && heightState !== 0) {
    mesh.position.y += heightState * 0.02;
  }

  if (!isGpsMode) {
    const mode =
      stateShip.moving > 0 ? '前進中（船首波 ON）' :
      stateShip.moving < 0 ? '後退中' :
      '待機中（波揺れ）';

    setStatus(
      `モード: 自由配置（Manual）\n状態: ${mode}\n高さY: ${mesh.position.y.toFixed(2)}\nスケール: ${curScale.toFixed(1)}`
    );
  }
}
loopShip();

/* ----------------------------------------------------------
   ★ 操作ボタン設定
---------------------------------------------------------- */
function setAction(id, moveVal, turnVal) {
  const btn = document.getElementById(id);
  if (!btn) return;

  const start = (e) => {
    if (e && e.cancelable) e.preventDefault();
    stateShip.moving = moveVal;
    stateShip.turning = turnVal;
  };

  const end = (e) => {
    if (e && e.cancelable) e.preventDefault();
    stateShip.moving = 0;
    stateShip.turning = 0;
  };

  btn.addEventListener('touchstart', start, {passive:false});
  btn.addEventListener('touchend', end, {passive:false});
  btn.addEventListener('touchcancel', end, {passive:false});
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup', end);
  btn.addEventListener('mouseleave', end);
}

setAction('btn-fwd', 1, 0);
setAction('btn-back', -1, 0);
setAction('btn-turn-left', 0, 1);
setAction('btn-turn-right', 0, -1);
setAction('btn-curve-left-fwd', 1, 1);
setAction('btn-curve-right-fwd', 1, -1);
setAction('btn-curve-left-back', -1, 1);
setAction('btn-curve-right-back', -1, -1);

document.getElementById('btn-stop').onclick = () => {
  stateShip.moving = 0;
  stateShip.turning = 0;
};

/* ----------------------------------------------------------
   ★ ズーム・高さ調整
---------------------------------------------------------- */
function bindHoldButton(id, onStart, onEnd) {
  const btn = document.getElementById(id);
  if (!btn) return;

  btn.addEventListener('touchstart', e => {
    if (e.cancelable) e.preventDefault();
    onStart();
  }, {passive:false});

  btn.addEventListener('touchend', onEnd, {passive:true});
  btn.addEventListener('touchcancel', onEnd, {passive:true});
  btn.addEventListener('mousedown', onStart);
  btn.addEventListener('mouseup', onEnd);
  btn.addEventListener('mouseleave', onEnd);
}

bindHoldButton('btn-zoom-in', () => { zoomState = 1; }, () => { zoomState = 0; });
bindHoldButton('btn-zoom-out', () => { zoomState = -1; }, () => { zoomState = 0; });
bindHoldButton('btn-height-up', () => { heightState = 1; }, () => { heightState = 0; });
bindHoldButton('btn-height-down', () => { heightState = -1; }, () => { heightState = 0; });

/* ----------------------------------------------------------
   ★ 撮影機能
---------------------------------------------------------- */
document.getElementById('btn-capture').onclick = () => {
  const cvs = document.querySelector('canvas');
  if (!cvs) return;

  cvs.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'koukaibune_ar_snapshot.png';
    a.click();
  });
};
</script>
<!-- ▼ モード切替ロジック（A‑Frame ↔ Three.js） -->
<script>
/* ----------------------------------------------------------
   ★ モード切替ボタン
---------------------------------------------------------- */
const btnShipMode = document.getElementById("btn-ship-mode");
const btnCraneMode = document.getElementById("btn-crane-mode");

const shipContainer = document.getElementById("ship-ar-container");
const craneContainer = document.getElementById("crane-ar-container");

/* ----------------------------------------------------------
   ★ 船ARモードへ切り替え
---------------------------------------------------------- */
btnShipMode.onclick = () => {
  btnShipMode.classList.add("active");
  btnCraneMode.classList.remove("active");

  shipContainer.style.display = "block";
  craneContainer.style.display = "none";

  // A-Frame のレンダリングを再開
  const scene = document.querySelector("#ship-scene");
  if (scene && scene.renderer) {
    scene.renderer.setAnimationLoop(() => {});
  }

  setStatus("船ARモードに切替");
};

/* ----------------------------------------------------------
   ★ CraneARモードへ切り替え
---------------------------------------------------------- */
btnCraneMode.onclick = () => {
  btnCraneMode.classList.add("active");
  btnShipMode.classList.remove("active");

  shipContainer.style.display = "none";
  craneContainer.style.display = "block";

  setStatus("CraneARモードに切替");
};

/* ----------------------------------------------------------
   ★ 初期状態：船ARモード
---------------------------------------------------------- */
shipContainer.style.display = "block";
craneContainer.style.display = "none";
btnShipMode.classList.add("active");
btnCraneMode.classList.remove("active");
</script>
</body>
