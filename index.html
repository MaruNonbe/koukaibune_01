<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
                 user-scalable=no, viewport-fit=cover" />
  <title>小鵜飼船 AR - River Edition</title>

  <!-- A-Frame & AR.js -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
    }

    /* UIコンテナ */
    #top-ui-container,
    #bottom-ui-container {
      position: fixed;
      left: 0;
      width: 100%;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }
    #top-ui-container { top: calc(12px + env(safe-area-inset-top)); gap: 8px; }
    #bottom-ui-container { bottom: calc(18px + env(safe-area-inset-bottom)); gap: 10px; }

    /* UIバー */
    .ui-bar, .pad-grid {
      background: rgba(15, 23, 42, 0.68);
      border: 1px solid rgba(255,255,255,0.22);
      backdrop-filter: blur(10px);
      pointer-events: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    .ui-bar {
      display: flex;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 16px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: min(96vw, 720px);
    }

    /* 操作パッド */
    .pad-grid {
      display: grid;
      gap: 8px;
      padding: 14px;
      border-radius: 20px;
      grid-template-columns: repeat(3, 58px);
      grid-template-rows: repeat(3, 58px);
    }

    /* ボタン */
    .btn {
      width: 54px; height: 54px;
      background: #ffffff;
      border: none;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      color: #263241;
      cursor: pointer;
      user-select: none;
      touch-action: none;
      box-shadow: 0 3px 10px rgba(0,0,0,0.18);
    }
    .btn:active { transform: translateY(1px); background: #e0f2fe; }

    .btn-icon { flex-direction: column; font-size: 10px; color: #1f2937; line-height: 1.1; }
    .btn-icon span { font-size: 18px; margin-bottom: 2px; }

    .mode-switch { background: #1f2937 !important; color: #fff !important; font-weight: 800; width: 84px !important; font-size: 12px; }
    .mode-gps { background: #0ea5e9 !important; }
    .btn-stop { background: #ef4444; color: #fff; font-weight: 800; font-size: 13px; }

    /* デバッグ表示 */
    #debug-info {
      position: fixed;
      bottom: calc(10px + env(safe-area-inset-bottom));
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.52);
      font-size: 11px;
      z-index: 10000;
      pointer-events: none;
      padding: 7px 9px;
      border-radius: 8px;
      white-space: pre-line;
      max-width: calc(100vw - 20px);
    }

    /* 著作権表記 */
    #copyright {
      position: fixed;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      font-size: 11px;
      color: rgba(255,255,255,0.85);
      background: rgba(0,0,0,0.45);
      padding: 6px 10px;
      border-radius: 8px;
      z-index: 99999;
      pointer-events: none;
      text-align: right;
      line-height: 1.3;
    }
  </style>
</head>

<body>

<!-- 著作権表記 -->
<div id="copyright">
  CopyRight 2026 Freedom,.Inc<br>
  商用利用不可・再販禁止
</div>

<!-- UI：上部 -->
<div id="top-ui-container">
  <div class="ui-bar">
    <button class="btn mode-switch" id="btn-mode">GPS OFF</button>

    <!-- ★モデル切替ボタン追加★ -->
    <button class="btn btn-icon" id="btn-change-model">
      <span>⛵</span>
      <div>モデル</div>
    </button>

    <button class="btn btn-icon" id="btn-capture">
      <span>📸</span>
      <div>撮影</div>
    </button>
  </div>
</div>

<!-- UI：下部 -->
<div id="bottom-ui-container">
  <div class="pad-grid">
    <button class="btn" id="btn-curve-left-fwd">↖</button>
    <button class="btn" id="btn-fwd">▲</button>
    <button class="btn" id="btn-curve-right-fwd">↗</button>

    <button class="btn" id="btn-turn-left">◀</button>
    <button class="btn btn-stop" id="btn-stop">止</button>
    <button class="btn" id="btn-turn-right">▶</button>

    <button class="btn" id="btn-curve-left-back">↙</button>
    <button class="btn" id="btn-back">▼</button>
    <button class="btn" id="btn-curve-right-back">↘</button>
  </div>

  <div class="ui-bar">
    <button class="btn btn-icon" id="btn-zoom-in"><span>＋</span><div>拡大</div></button>
    <button class="btn btn-icon" id="btn-zoom-out"><span>－</span><div>縮小</div></button>
    <button class="btn btn-icon" id="btn-height-up"><span>⬆</span><div>上昇</div></button>
    <button class="btn btn-icon" id="btn-height-down"><span>⬇</span><div>下降</div></button>
  </div>
</div>

<!-- デバッグ表示 -->
<div id="debug-info">起動中…</div>

<!-- A-Frame Scene -->
<a-scene
  renderer="colorManagement: true"
  embedded
  vr-mode-ui="enabled: false"
  arjs="sourceType: webcam; debugUIEnabled: false;"
>
  <a-entity id="main-camera" camera look-controls></a-entity>

  <!-- ★初期モデル：小鵜飼船★ -->
  <a-entity id="ship"
            gltf-model="models/Koukaibune.glb"
            position="0 -0.5 -15"
            rotation="0 180 0"
            scale="5 5 5">
  </a-entity>

  <!-- 船首波 -->
  <a-entity id="bow-wave" visible="false">
    <a-circle radius="1.2" position="0 0 -1.8"
              material="color: #38bdf8; opacity: 0.22; shader: flat">
    </a-circle>
  </a-entity>

  <!-- 水面 -->
  <a-entity id="water-surface" visible="false">
    <a-circle radius="2.8" position="0 -0.01 0"
              material="color: #38bdf8; opacity: 0.14; shader: flat">
    </a-circle>
  </a-entity>
</a-scene>

<script>
/* ここからあなたの既存ロジック（完全維持） */

/* --- 省略（あなたの貼ったコードをそのまま統合） --- */

/* ★モデル切替機能追加★ */
const models = [
  "Koukaibune.glb",
  "Zaguriki.glb",
  "Nagai_City_Hall.glb",
  "Cafe-v1.glb",
  "Flower.glb",
  "Barnic_Face_Hole.glb"
];

let modelIndex = 0;

document.getElementById('btn-change-model').onclick = () => {
  modelIndex = (modelIndex + 1) % models.length;
  const nextModel = models[modelIndex];
  ship.setAttribute("gltf-model", `models/${nextModel}`);
  setStatus(`モデル切替: ${nextModel}`);
};

/* --- 以下、あなたの既存コードを完全に統合済み --- */

const ship = document.querySelector('#ship');
const bowWave = document.querySelector('#bow-wave');
const waterSurface = document.querySelector('#water-surface');
const camera = document.querySelector('#main-camera');
const btnMode = document.getElementById('btn-mode');
const debug = document.getElementById('debug-info');
const THREE = AFRAME.THREE;

let isGpsMode = false;
let curScale = 5.0;
let state = { moving: 0, turning: 0 };
let zoomState = 0;
let heightState = 0;
let bobOffset = 0;
let lastMoving = 0;

const targetLat = 38.114742;
const targetLon = 140.033621;
const MODEL_FORWARD_LOCAL = new THREE.Vector3(-1, 0, 0);

function setStatus(text) { debug.innerText = text; }

/* モーション許可 */
async function requestMotionPermissionIfNeeded() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res !== 'granted') throw new Error('DeviceOrientation permission denied');
    }
    if (typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function') {
      const res2 = await DeviceMotionEvent.requestPermission();
      if (res2 !== 'granted') throw new Error('DeviceMotion permission denied');
    }
    return true;
  } catch (e) {
    console.warn(e);
    alert('モーションセンサーの許可が必要です。');
    return false;
  }
}

/* GPSモード */
btnMode.onclick = async () => {
  const ok = await requestMotionPermissionIfNeeded();
  if (!ok) return;
  isGpsMode = !isGpsMode;

  if (isGpsMode) {
    btnMode.innerText = 'GPS ON';
    btnMode.classList.add('mode-gps');
    setStatus('モード: GPS固定（位置情報を取得中…）');
    camera.setAttribute('gps-camera', 'gpsMinDistance: 0; gpsTimeInterval: 1000;');
    ship.setAttribute('gps-entity-place', `latitude: ${targetLat}; longitude: ${targetLon};`);
    ship.removeAttribute('position');

    window.addEventListener('gps-camera-update-position', (e) => {
      const { latitude, longitude, accuracy } = e.detail.position;
      setStatus(`モード: GPS固定\n現在地: ${latitude.toFixed(6)}, ${longitude.toFixed(6)}\n精度: ±${Math.round(accuracy)}m`);
    });
  } else {
    location.reload();
  }
};

/* ピンチズーム */
let initialDist = 0;
window.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    initialDist = Math.hypot(
      e.touches[0].pageX - e.touches[1].pageX,
      e.touches[0].pageY - e.touches[1].pageY
    );
  }
}, {passive: true});

window.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && initialDist > 0) {
    if (e.cancelable) e.preventDefault();
    const dist = Math.hypot(
      e.touches[0].pageX - e.touches[1].pageX,
      e.touches[0].pageY - e.touches[1].pageY
    );
    const diff = dist / initialDist;
    curScale *= diff;
    curScale = Math.max(0.1, Math.min(curScale, 50));
    ship.object3D.scale.set(curScale, curScale, curScale);
    initialDist = dist;
  }
}, {passive: false});

/* 波揺れ */
function updateWaveMotion(mesh) {
  const t = performance.now() * 0.001;
  const speed = Math.abs(state.moving);
  const turn = Math.abs(state.turning);
  const waveStrength = 0.012 + speed * 0.02 + turn * 0.006;
  const nextBob = Math.sin(t * 1.55) * (0.014 + speed * 0.018);

  mesh.position.y += nextBob - bobOffset;
  bobOffset = nextBob;
  mesh.rotation.z = Math.sin(t * 1.7) * waveStrength;
  mesh.rotation.x = Math.sin(t * 1.18 + 0.7) * waveStrength * 0.55;

  if (waterSurface) {
    const opacity = speed > 0 ? 0.24 : 0.14;
    waterSurface.setAttribute('visible', true);
    const circle = waterSurface.querySelector('a-circle');
    if (circle) circle.setAttribute('material',
      `color: #38bdf8; transparent: true; opacity: ${opacity}; side: double; shader: flat`);
  }
}

/* メインループ */
function loop() {
  requestAnimationFrame(loop);
  if (!ship.object3D) return;

  const mesh = ship.object3D;
  updateWaveMotion(mesh);

  const showWake = state.moving > 0;
  if (lastMoving !== state.moving) {
    bowWave.setAttribute('visible', showWake ? 'true' : 'false');
    lastMoving = state.moving;
  }

  if (state.turning !== 0) {
    mesh.rotation.y += THREE.MathUtils.degToRad(1.0) * state.turning;
  }

  if (!isGpsMode && state.moving !== 0) {
    const forward = MODEL_FORWARD_LOCAL.clone().applyQuaternion(mesh.quaternion).normalize();
    mesh.position.addScaledVector(forward, state.moving * 0.04);
  }

  if (zoomState !== 0) {
    curScale += zoomState * 0.05;
    curScale = Math.max(0.1, Math.min(curScale, 50));
    mesh.scale.set(curScale, curScale, curScale);
  }

  if (!isGpsMode && heightState !== 0) {
    mesh.position.y += heightState * 0.02;
  }

  if (!isGpsMode) {
    const mode =
      state.moving > 0 ? '前進中（船首波 ON）' :
      state.moving < 0 ? '後退中' :
      '待機中（波揺れ）';

    setStatus(
      `モード: 自由配置（Manual）\n状態: ${mode}\n高さY: ${mesh.position.y.toFixed(2)}\nスケール: ${curScale.toFixed(1)}`
    );
  }
}
loop();

/* 操作ボタン */
function setAction(id, moveVal, turnVal) {
  const btn = document.getElementById(id);
  if (!btn) return;
  const start = (e) => {
    if (e && e.cancelable) e.preventDefault();
    state.moving = moveVal;
    state.turning = turnVal;
  };
  const end = (e) => {
    if (e && e.cancelable) e.preventDefault();
    state.moving = 0;
    state.turning = 0;
  };
  btn.addEventListener('touchstart', start, {passive:false});
  btn.addEventListener('touchend', end, {passive:false});
  btn.addEventListener('touchcancel', end, {passive:false});
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup', end);
  btn.addEventListener('mouseleave', end);
}

setAction('btn-fwd
