<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
                 user-scalable=no, viewport-fit=cover" />
  <title>小鵜飼船 AR - River Edition</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
    }

    #top-ui-container, #bottom-ui-container {
      position: fixed;
      left: 0;
      width: 100%;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    #top-ui-container {
      top: calc(12px + env(safe-area-inset-top));
      gap: 8px;
    }

    #bottom-ui-container {
      bottom: calc(18px + env(safe-area-inset-bottom));
      gap: 10px;
    }

    .ui-bar, .pad-grid {
      background: rgba(15, 23, 42, 0.68);
      border: 1px solid rgba(255,255,255,0.22);
      backdrop-filter: blur(10px);
      pointer-events: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }

    .ui-bar {
      display: flex;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 16px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: min(96vw, 720px);
    }

    .pad-grid {
      display: grid;
      gap: 8px;
      padding: 14px;
      border-radius: 20px;
      grid-template-columns: repeat(3, 58px);
      grid-template-rows: repeat(3, 58px);
    }

    .btn {
      width: 54px;
      height: 54px;
      background: #ffffff;
      border: none;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      color: #263241;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      box-shadow: 0 3px 10px rgba(0,0,0,0.18);
    }

    .btn:active {
      transform: translateY(1px);
      background: #e0f2fe;
    }

    .btn-icon {
      flex-direction: column;
      font-size: 10px;
      color: #1f2937;
      line-height: 1.1;
    }

    .btn-icon span {
      font-size: 18px;
      margin-bottom: 2px;
    }

    .mode-switch {
      background: #1f2937 !important;
      color: #fff !important;
      font-weight: 800;
      width: 84px !important;
      font-size: 12px;
    }

    .mode-gps {
      background: #0ea5e9 !important;
    }

    .btn-stop {
      background: #ef4444;
      color: #fff;
      font-weight: 800;
      font-size: 13px;
    }

    #debug-info {
      position: fixed;
      bottom: calc(10px + env(safe-area-inset-bottom));
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.52);
      font-size: 11px;
      z-index: 10000;
      pointer-events: none;
      padding: 7px 9px;
      border-radius: 8px;
      white-space: pre-line;
      max-width: calc(100vw - 20px);
    }
  </style>
</head>

<body>

<div id="debug-info">モード: 自由配置（Manual）</div>

<a-scene
  vr-mode-ui="enabled: false"
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false; videoTexture: true; facingMode: environment;"
  renderer="precision: mediump; antialias: true; alpha: true; colorManagement: true; exposure: 1.2;"
>
  <a-light type="ambient" color="#FFF" intensity="1.45"></a-light>
  <a-light type="directional" position="-1 4 2" intensity="1.0"></a-light>
  <a-light type="hemisphere" color="#FFF" groundColor="#445" intensity="1.1"></a-light>

  <a-camera id="main-camera"></a-camera>

  <a-entity id="ship"
            gltf-model="models/koukaihune.glb"
            position="0 -0.5 -15"
            rotation="0 180 0"
            scale="5.0 5.0 5.0">

    <!-- 水面 -->
    <a-entity id="water-surface" position="-0.15 -0.025 0" rotation="-90 0 0" visible="true">
      <a-circle radius="2.25" segments="64"
                material="color: #38bdf8; transparent: true; opacity: 0.18; side: double; shader: flat"
                animation="property: rotation; to: 0 0 360; dur: 18000; loop: true; easing: linear">
      </a-circle>

      <a-ring radius-inner="1.35" radius-outer="1.42" segments-theta="72"
              material="color: #e0f2fe; transparent: true; opacity: 0.24; side: double; shader: flat"
              animation="property: scale; from: 0.92 0.92 1; to: 1.16 1.16 1; dur: 2600; loop: true; dir: alternate; easing: easeInOutSine">
      </a-ring>
    </a-entity>

    <!-- 船首波 -->
    <a-entity id="bow-wave" visible="false">
      <a-plane class="foam" position="-1.28 0 -0.32" rotation="-90 -62 0"
               width="0.72" height="1.35"
               material="transparent: true; opacity: 0.55; shader: flat; color: #ffffff; side: double"
               animation="property: scale; from: 0.2 0.18 1; to: 1.7 2.7 1; dur: 1050; loop: true; easing: easeOutQuad"
               animation__fade="property: material.opacity; from: 0.58; to: 0; dur: 1050; loop: true; easing: easeOutQuad">
      </a-plane>

      <a-plane class="foam" position="-1.28 0 0.32" rotation="-90 -118 0"
               width="0.72" height="1.35"
               material="transparent: true; opacity: 0.55; shader: flat; color: #ffffff; side: double"
               animation="property: scale; from: 0.2 0.18 1; to: 1.7 2.7 1; dur: 1050; loop: true; delay: 160; easing: easeOutQuad"
               animation__fade="property: material.opacity; from: 0.58; to: 0; dur: 1050; loop: true; delay: 160; easing: easeOutQuad">
      </a-plane>
    </a-entity>

  </a-entity>
</a-scene>

<!-- 船ARロジック（既存コード） -->
<script>
  /* ここにあなたの既存の船ARロジックが続きます */
</script>

</body>
</html>
