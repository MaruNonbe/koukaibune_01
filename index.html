<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
                 user-scalable=no, viewport-fit=cover" />
  <title>小鵜飼船 AR - River Edition</title>

  <!-- A-Frame / AR.js -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <!-- ▼▼▼ 追加：自治体名オーバーレイ用の共通設定ファイル ▼▼▼ -->
  <script src="city-config.js"></script>
  <!-- ▲▲▲ 追加ここまで ▲▲▲ -->

  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
    }

    /* UI コンテナ */
    #top-ui-container,
    #bottom-ui-container {
      position: fixed;
      left: 0;
      width: 100%;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }
    #top-ui-container { top: calc(12px + env(safe-area-inset-top)); gap: 8px; }
    #bottom-ui-container { bottom: calc(18px + env(safe-area-inset-bottom)); gap: 10px; }

    /* UI パネル */
    .ui-bar, .pad-grid {
      background: rgba(15, 23, 42, 0.68);
      border: 1px solid rgba(255,255,255,0.22);
      backdrop-filter: blur(10px);
      pointer-events: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    .ui-bar {
      display: flex; gap: 6px;
      padding: 6px 8px;
      border-radius: 16px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: min(96vw, 720px);
    }
    .pad-grid {
      display: grid; gap: 8px;
      padding: 14px;
      border-radius: 20px;
      grid-template-columns: repeat(3, 58px);
      grid-template-rows: repeat(3, 58px);
    }

    /* ボタン */
    .btn {
      width: 54px; height: 54px;
      background: #ffffff;
      border: none;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      color: #263241;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 3px 10px rgba(0,0,0,0.18);
    }
    .btn:active { transform: translateY(1px); background: #e0f2fe; }

    .btn-icon { flex-direction: column; font-size: 10px; color: #1f2937; }
    .btn-icon span { font-size: 18px; margin-bottom: 2px; }

    .mode-switch { background: #1f2937 !important; color: #fff !important; font-weight: 800; width: 84px !important; font-size: 12px; }
    .mode-gps { background: #0ea5e9 !important; }
    .btn-stop { background: #ef4444; color: #fff; font-weight: 800; font-size: 13px; }

    /* デバッグ表示 */
    #debug-info {
      position: fixed;
      bottom: calc(10px + env(safe-area-inset-bottom));
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.52);
      font-size: 11px;
      z-index: 10000;
      pointer-events: none;
      padding: 7px 9px;
      border-radius: 8px;
      white-space: pre-line;
      max-width: 46vw;
    }

    /* 著作権表示 */
    #copyright {
      position: fixed;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      color: rgba(255,255,255,0.85);
      font-size: 12px;
      z-index: 9999;
      pointer-events: none;
      max-width: 48vw;
      text-align: right;
      white-space: normal;
    }

    /* ▼▼▼ 追加：画面幅が狭いスマートフォンでは、左下（モード表示）と
       右下（自治体名キャプション）が同じ高さで衝突するため、
       キャプションを一段上に積んで衝突を避ける ▼▼▼ */
    @media (max-width: 480px) {
      #debug-info {
        font-size: 9.5px;
      }
      #copyright {
        left: 8px;
        right: 8px;
        max-width: calc(100vw - 16px);
        bottom: calc(34px + env(safe-area-inset-bottom));
        font-size: 10px;
        text-align: right;
      }
    }
    /* ▲▲▲ 追加ここまで ▲▲▲ */

    /* ▼▼▼ 追加：起動時タイトルオーバーレイ（既存UIと同じガラス調デザインに統一） ▼▼▼ */
    #ar-title-overlay {
      position: fixed;
      top: calc(14% + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      text-align: center;
      color: #fff;
      background: rgba(15, 23, 42, 0.68);
      border: 1px solid rgba(255,255,255,0.22);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      border-radius: 16px;
      padding: 14px 22px;
      pointer-events: none;
      transition: opacity 1s ease;
      max-width: min(90vw, 560px);
    }
    #ar-title-overlay.fade-out { opacity: 0; }
    .ar-title-main {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .ar-title-sub {
      font-size: 0.8rem;
      opacity: 0.85;
    }

    /* ▼▼▼ 追加：画面幅が狭いスマートフォンでは、上部ボタンが2段に折り返わり
       タイトル表示（画面上から14%の位置）と重なるため、
       ①ボタンを小さくして1段に収まるようにし、
       ②タイトルの位置をボタン列の下に固定値で配置し直す ▼▼▼ */
    @media (max-width: 480px) {
      .ui-bar {
        max-width: 96vw;
        gap: 4px;
        padding: 5px 6px;
      }
      .btn {
        width: 42px;
        height: 42px;
        font-size: 17px;
        border-radius: 10px;
      }
      .btn-icon { font-size: 7.5px; }
      .btn-icon span { font-size: 14px; margin-bottom: 1px; }
      .mode-switch { width: 58px !important; font-size: 9.5px; }

      #ar-title-overlay {
        /* 1段に収めたボタン列（高さ約 42px + 上下パディング + コンテナのtopオフセット）
           の下に、画面の高さに関わらず確実に収まる固定値に変更 */
        top: calc(70px + env(safe-area-inset-top));
        padding: 10px 16px;
        max-width: 94vw;
      }
      .ar-title-main { font-size: 1.05rem; }
      .ar-title-sub { font-size: 0.72rem; }
    }
    /* ▲▲▲ 追加ここまで ▲▲▲ */
    /* ▲▲▲ 追加ここまで ▲▲▲ */
  </style>
</head>

<body>

<div id="debug-info">モード: 自由配置（Manual）</div>

<!-- ▼▼▼ 追加：起動時タイトル表示（数秒後に自動でフェードアウト） ▼▼▼ -->
<div id="ar-title-overlay">
  <div class="ar-title-main"></div>
  <div class="ar-title-sub">Freedom　土屋忠彰</div>
</div>
<!-- ▲▲▲ 追加ここまで ▲▲▲ -->

<!-- A-Frame Scene -->
<a-scene
  id="ship-scene"
  renderer="precision: mediump; antialias: true; alpha: true; colorManagement: true; exposure: 1.2;"
  embedded
  vr-mode-ui="enabled: false"
  arjs="sourceType: webcam; debugUIEnabled: false; videoTexture: true; facingMode: environment;"
>
  <a-light type="ambient" color="#FFF" intensity="1.45"></a-light>
  <a-light type="directional" position="-1 4 2" intensity="1.0"></a-light>
  <a-light type="hemisphere" color="#FFF" groundColor="#445" intensity="1.1"></a-light>

  <a-camera id="main-camera"></a-camera>

  <!-- 船モデル -->
  <a-entity id="ship"
            gltf-model="models/koukaihune.glb"
            position="0 -0.5 -15"
            rotation="0 180 0"
            scale="5 5 5">

    <!-- 水面 -->
    <a-entity id="water-surface" position="-0.15 -0.025 0" rotation="-90 0 0" visible="true">
      <a-circle radius="2.25" segments="64"
                material="color: #38bdf8; transparent: true; opacity: 0.18; side: double; shader: flat"
                animation="property: rotation; to: 0 0 360; dur: 18000; loop: true; easing: linear">
      </a-circle>
      <a-ring radius-inner="1.35" radius-outer="1.42" segments-theta="72"
              material="color: #e0f2fe; transparent: true; opacity: 0.24; side: double; shader: flat"
              animation="property: scale; from: 0.92 0.92 1; to: 1.16 1.16 1; dur: 2600; loop: true; dir: alternate; easing: easeInOutSine">
      </a-ring>
    </a-entity>

    <!-- 船首波 -->
    <a-entity id="bow-wave" visible="false">
      <a-plane class="foam" position="-1.28 0 -0.32" rotation="-90 -62 0" width="0.72" height="1.35"
               material="transparent: true; opacity: 0.55; shader: flat; color: #ffffff; side: double"
               animation="property: scale; from: 0.2 0.18 1; to: 1.7 2.7 1; dur: 1050; loop: true; easing: easeOutQuad"
               animation__fade="property: material.opacity; from: 0.58; to: 0; dur: 1050; loop: true; easing: easeOutQuad">
      </a-plane>
      <a-plane class="foam" position="-1.28 0 0.32" rotation="-90 -118 0" width="0.72" height="1.35"
               material="transparent: true; opacity: 0.55; shader: flat; color: #ffffff; side: double"
               animation="property: scale; from: 0.2 0.18 1; to: 1.7 2.7 1; dur: 1050; loop: true; delay: 160; easing: easeOutQuad"
               animation__fade="property: material.opacity; from: 0.58; to: 0; dur: 1050; loop: true; delay: 160; easing: easeOutQuad">
      </a-plane>
    </a-entity>

  </a-entity>
</a-scene>

<!-- UI（上部） -->
<div id="top-ui-container">
  <div class="ui-bar">
    <div class="btn mode-switch" id="btn-mode">GPS OFF</div>
    <div class="btn btn-icon" id="btn-horn"><span>♪</span><div>音</div></div>
    <div class="btn btn-icon" id="btn-height-up"><span>▲</span><div>高さ</div></div>
    <div class="btn btn-icon" id="btn-height-down"><span>▼</span><div>高さ</div></div>
    <div class="btn btn-icon" id="btn-zoom-in"><span>＋</span><div>拡大</div></div>
    <div class="btn btn-icon" id="btn-zoom-out"><span>−</span><div>縮小</div></div>
    <div class="btn btn-icon" id="btn-capture"><span>□</span><div>撮影</div></div>
  </div>
</div>

<!-- UI（下部） -->
<div id="bottom-ui-container">
  <div class="pad-grid">
    <div class="btn" id="btn-curve-left-fwd">↖</div>
    <div class="btn" id="btn-fwd">↑</div>
    <div class="btn" id="btn-curve-right-fwd">↗</div>
    <div class="btn" id="btn-turn-left">←</div>
    <div class="btn btn-stop" id="btn-stop">STOP</div>
    <div class="btn" id="btn-turn-right">→</div>
    <div class="btn" id="btn-curve-left-back">↙</div>
    <div class="btn" id="btn-back">↓</div>
    <div class="btn" id="btn-curve-right-back">↘</div>
  </div>
</div>

<!-- 船ARロジック（Part5：タッチ操作・ボタン操作） -->
<script src="part5-ship-controls.js"></script>

<!-- Copyright -->
<div id="copyright">© 2026 Freedom</div>

<!-- ▼▼▼ 追加：自治体名を自動で差し込むスクリプト（必ず一番最後に置く） ▼▼▼ -->
<script>
  (function () {
    function getCityName() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get("city");
      return (typeof CITY_NAMES !== "undefined" && CITY_NAMES[code]) || null;
    }

    function setupCityOverlay() {
      const cityName = getCityName();
      const titleMain = document.querySelector(".ar-title-main");
      const titleOverlay = document.getElementById("ar-title-overlay");
      const copyright = document.getElementById("copyright");

      if (!titleMain || !titleOverlay || !copyright) {
        console.warn("[city-overlay] 表示用の要素が見つかりません。");
        return;
      }

      // city パラメータが無い/該当なしの場合は「自治体様向け」を既定表示にする
      const label = cityName ? `${cityName}様向け` : "自治体様向け";

      titleMain.textContent = `${label}ARデモンストレーション`;
      copyright.textContent = `${label}デモンストレーション　© 2026 Freedom`;

      // タイトルは4秒表示後にフェードアウト。右下の著作権表示は常時表示のまま
      setTimeout(() => {
        titleOverlay.classList.add("fade-out");
      }, 4000);
    }

    window.addEventListener("DOMContentLoaded", setupCityOverlay);
  })();
</script>
<!-- ▲▲▲ 追加ここまで ▲▲▲ -->

</body>
</html>
