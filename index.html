<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
                 user-scalable=no, viewport-fit=cover" />
  <title>小鵜飼船 AR - River Edition</title>

  <!-- A-Frame & AR.js -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
    }

    /* 上部UI */
    #top-ui-container {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      gap: 10px;
    }

    .btn {
      background: rgba(15,23,42,0.78);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.22);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    /* 下部UI */
    #bottom-ui-container {
      position: fixed;
      bottom: calc(12px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pad-grid {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      gap: 10px;
      justify-content: center;
    }

    #debug-info {
      position: fixed;
      bottom: 10px;
      left: 10px;
      color: #fff;
      font-size: 12px;
      z-index: 9999;
    }
  </style>
</head>

<body>

<!-- 上部UI -->
<div id="top-ui-container">
  <button class="btn" id="btn-mode">GPS OFF</button>
  <button class="btn" id="btn-change-model">モデル</button>
  <button class="btn" id="btn-capture">撮影</button>
</div>

<!-- 下部UI -->
<div id="bottom-ui-container">
  <div class="pad-grid">
    <button class="btn" id="btn-curve-left-fwd">↖</button>
    <button class="btn" id="btn-fwd">▲</button>
    <button class="btn" id="btn-curve-right-fwd">↗</button>

    <button class="btn" id="btn-turn-left">◀</button>
    <button class="btn" id="btn-stop">止</button>
    <button class="btn" id="btn-turn-right">▶</button>

    <button class="btn" id="btn-curve-left-back">↙</button>
    <button class="btn" id="btn-back">▼</button>
    <button class="btn" id="btn-curve-right-back">↘</button>
  </div>
</div>

<div id="debug-info">起動中…</div>

<!-- A-Frame Scene -->
<a-scene
  id="ship-scene"
  renderer="colorManagement: true"
  embedded
  vr-mode-ui="enabled: false"
  arjs="sourceType: webcam; debugUIEnabled: false;"
>
  <a-entity id="main-camera" camera look-controls></a-entity>

  <a-entity id="ship"
            gltf-model="models/Koukaibune.glb"
            position="0 -0.5 -15"
            rotation="0 180 0"
            scale="5 5 5">
  </a-entity>

  <a-entity id="bow-wave" visible="false">
    <a-circle radius="1.2" position="0 0 -1.8"
              material="color: #38bdf8; opacity: 0.22; shader: flat">
    </a-circle>
  </a-entity>

  <a-entity id="water-surface" visible="false">
    <a-circle radius="2.8" position="0 -0.01 0"
              material="color: #38bdf8; opacity: 0.14; shader: flat">
    </a-circle>
  </a-entity>

</a-scene>

<!-- 船ARロジック（あなたの既存コードをそのまま使用） -->
<script>
  /* ここに Part 5 の船ARロジックをそのまま貼り付ければ完成 */
</script>

</body>
</html>
